name: platform

# `pnpm dev` runs this. One container runs both the Next.js dashboard (:3001) and
# the runner daemon (:4319) via `pnpm dev:container`. The app is host-coupled by
# design, so we bind-mount the pieces it needs to stay functional inside the container:
#   - the repo source (hot reload), with node_modules/.next masked by named volumes
#     so the Linux-built native modules from the image aren't shadowed by the host's
#   - ~/.claude  → the runner reuses your Claude Code login + plugins
#   - your whole host home → mounted at the SAME absolute path so project paths stored
#                  in the DB (e.g. /Users/you/Documents/Matcher) resolve inside the
#                  container, and so the folder picker can browse anywhere you keep code
#   - ~/.gitconfig → so commits the agent makes carry your identity
# This yields a reproducible runtime, **not isolation** — and with the home mount it is
# not much of a sandbox either: tasks can read and write anything under your home,
# ~/.ssh included. The container runs as the unprivileged `node` user (HOME=/home/node)
# and ports bind to loopback only.

services:
  platform:
    container_name: platform
    build:
      context: ../..
      dockerfile: Dockerfile
      target: dev
    working_dir: /app
    # Loopback-only: reachable from the browser on this host, not from the LAN.
    # The runner (:4319) is NOT published — the browser reaches it only through the
    # session-gated /api/tasks/[id]/* proxy routes served by Next.js.
    ports:
      - "127.0.0.1:3001:3001" # Next.js dashboard
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # The runner binds loopback by default (it has no auth of its own). Inside a container
      # that would make the published port below unreachable, so bind all interfaces *in the
      # container* — the publish is 127.0.0.1-only, so it still isn't on the network.
      RUNNER_HOST: 0.0.0.0
      # Where the in-app folder picker may browse (colon-separated, PATH-style). The FIRST
      # entry is where it opens; the rest show as switchable roots. These are HOST paths —
      # the container's own home is /home/node, so it must be told explicitly. Every entry
      # needs a matching bind mount below, or it just lists an empty folder.
      # `/` is deliberately NOT a root: inside the container that's the *container's* root
      # filesystem (/bin, /etc, …), not your Mac's, so it would show paths that don't exist
      # on the host. Set PROJECT_ROOTS=/ if you want it anyway.
      PROJECT_ROOTS: ${HOME}:/Users:/Volumes
      # Make git push/pull and `gh pr create` over HTTPS to github.com authenticate
      # with your GH_TOKEN (set in .env) via gh's credential helper — WITHOUT writing
      # to the read-only, bind-mounted ~/.gitconfig. These GIT_CONFIG_* vars are read
      # after the config files, so KEY_0 clears the host's macOS `osxkeychain` helper
      # (which doesn't exist in Linux), and KEY_1 routes github.com creds through gh.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ""
      GIT_CONFIG_KEY_1: credential.https://github.com.helper
      GIT_CONFIG_VALUE_1: "!gh auth git-credential"
    # Claude auth is PER USER: each signed-in user saves their own token in
    # Settings, encrypted under SECRETS_MASTER_KEY (required — set it in the
    # repo-root .env; see .env.example). The runner injects the task owner's token
    # into each session's env. The legacy shared CLAUDE_CODE_OAUTH_TOKEN /
    # ANTHROPIC_API_KEY are honored only with ALLOW_SHARED_TOKEN_FALLBACK=1
    # (dev-only). env_file paths are relative to THIS compose file, hence ../../.
    env_file:
      - path: ../../.env
        required: false
    volumes:
      # Repo source for hot reload. node_modules + .next are masked so the image's
      # Linux build wins over the host's (better-sqlite3 is a native module).
      - ../..:/app
      - platform_node_modules:/app/node_modules
      - platform_next:/app/.next
      # Claude Code login + installed plugins (read-write: the SDK writes sessions).
      - ${HOME}/.claude:/home/node/.claude
      # All user homes + mounted drives, at their identical absolute paths, so DB-stored
      # project paths resolve and the picker can browse wherever you keep code. A project
      # MUST live under a mounted path — otherwise the runner can't see it either.
      # Deliberately broad: everything here is readable AND writable by tasks (~/.ssh,
      # ~/Library, app data included). Narrow it to specific folders (e.g. ${HOME}/Dev,
      # ${HOME}/work) if that's too much, keeping PROJECT_ROOTS above in sync.
      # NOTE: `/Users` + `/Volumes` are the **macOS** layout. On a Linux host use `/home` (and
      # `/mnt`, `/media`) here and in PROJECT_ROOTS. On Windows, run the whole thing from WSL2
      # and use its Linux paths — a native `C:\…` path cannot resolve inside a Linux container,
      # which breaks the same-absolute-path contract the DB and runner rely on.
      - /Users:/Users
      # External/network drives. Note: volumes mounted on the host *after* this container
      # starts may not appear inside it (bind mounts don't propagate sub-mounts) — restart
      # the container after plugging a drive in.
      - /Volumes:/Volumes
      # Git identity for commits the agent makes.
      - ${HOME}/.gitconfig:/home/node/.gitconfig:ro
      # SSH keys — only needed if your project remotes use SSH (git@github.com:…).
      # HTTPS remotes authenticate via GH_TOKEN (above) and don't need this. Uncomment
      # if you push/pull over SSH (keys are read-only; passphrase-protected keys won't
      # work without an agent — switch the remote to HTTPS, or use GH_TOKEN instead):
      # - ${HOME}/.ssh:/home/node/.ssh:ro
    # tini (image ENTRYPOINT) reaps the concurrently-spawned web + runner processes.

volumes:
  platform_node_modules:
  platform_next:
