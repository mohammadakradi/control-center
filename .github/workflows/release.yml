name: Release

# Cutting a release:
#   1. bump "version" in package.json  (this is the source of truth)
#   2. tag it and push the tag
#   3. publish the release on GitHub (Releases → Draft/Publish, picking that tag)
#
# Step 3 is the trigger: this runs on `release: published`, not on the tag push, so a tag on
# its own never publishes anything — you decide when it goes out. The run then attaches the
# runtime tarball, the installer and the checksums to the release you just published.
#
# There is no Docker image: releases install natively (Node 22+); Docker is the dev runtime.
on:
  release:
    types: [published]
  # Manual re-run for an existing tag — how you recover a release whose run failed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.2.0"
        required: true

permissions:
  contents: write # create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The published release's tag, or the one given to a manual re-run. Never a branch:
          # a release must be built from exactly the tree its tag points at.
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve tag and check it matches package.json
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          pkg=$(node -p 'require("./package.json").version')
          # Accept `v0.1.0` and `0.1.0` alike; package.json is what the app reports.
          if [ "${tag#v}" != "$pkg" ]; then
            echo "::error::tag $tag doesn't match package.json version $pkg."
            echo "::error::Bump package.json to ${tag#v} (or retag) — the installed version is read from package.json."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

      # Gates. `pnpm build` is deliberately absent: it fails on this Next version while
      # prerendering Next's own /_global-error page, and releases ship the dev server. See
      # CLAUDE.md. Adding it here would block every release on an upstream bug.
      - name: Install dependencies
        run: npx --yes pnpm@9.12.1 install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx --yes pnpm@9.12.1 lint

      - name: Test
        run: npx --yes pnpm@9.12.1 test

      # An installed app upgrades by running the SQL files in drizzle/. If the schema changed
      # without a matching migration, that release would start against a database it can't
      # query — so refuse to publish until the migration is committed.
      - name: Check migrations cover the schema
        run: |
          npx --yes pnpm@9.12.1 db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::lib/db/schema.ts has changes with no migration in drizzle/."
            echo "::error::Run 'pnpm db:generate', review the SQL, and commit it."
            git status --porcelain drizzle
            exit 1
          fi
          echo "migrations are in sync with the schema"

      - name: Build the release tarball
        run: sh infra/release/pack.sh "${{ steps.version.outputs.version }}"

      - name: Stage assets and checksums
        working-directory: dist
        run: |
          cp ../infra/release/install.sh .
          sha256sum control-center-*.tar.gz install.sh > SHA256SUMS
          cat SHA256SUMS

      # Sanity check on what's about to be published: the tarball must not carry local state.
      # pack.sh uses an allowlist, so this should be impossible — which is exactly why it's
      # worth asserting before the artefact becomes public and permanent.
      - name: Assert the tarball carries no local state
        working-directory: dist
        run: |
          if tar -tzf control-center-*.tar.gz | grep -E '(^|/)(data|\.env|\.git)(/|$)'; then
            echo "::error::the release tarball contains local state — aborting."
            exit 1
          fi
          echo "clean"

      # Install instructions first, then GitHub's generated changelog. Composed by hand
      # because `--notes-file` and `--generate-notes` are mutually exclusive in gh.
      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > dist/notes.md <<NOTES
          ## Install

          Requires **Node.js 22+**. No Docker, no clone, no build.

          \`\`\`sh
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh -o install.sh
          less install.sh          # read before running anything from the internet
          sh install.sh
          control-center start
          \`\`\`

          Already installed? \`control-center start\` finds this release and updates before launching.

          Your database, encrypted tokens and settings live in \`~/.control-center/\` and survive
          updates. Schema changes are migrated automatically on start, and your database is
          copied into \`~/.control-center/data/backup/\` before anything changes it.

          ---

          NOTES
          gh api --method POST "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body >> dist/notes.md 2>/dev/null \
            || echo "_No generated changelog available._" >> dist/notes.md

      # Create or update. A release for the tag often already exists — GitHub creates one when
      # you publish from the UI, and re-running this workflow on the same tag is normal — so
      # `gh release create` alone fails with "a release with the same tag name already exists".
      # Uploading with --clobber makes a re-run replace the assets instead.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          assets="dist/control-center-$VERSION.tar.gz dist/install.sh dist/SHA256SUMS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — attaching assets."
            # Only fill in notes if the release has none. On a `release: published` run the
            # author has usually just written them, and replacing their text with generated
            # boilerplate would be worse than adding nothing.
            if [ -z "$(gh release view "$TAG" --json body --jq '.body' | tr -d '[:space:]')" ]; then
              gh release edit "$TAG" --notes-file dist/notes.md
              echo "Release had no notes — filled in the install instructions."
            else
              echo "Keeping the existing release notes."
            fi
            # shellcheck disable=SC2086 # deliberate word splitting into separate file args
            gh release upload "$TAG" $assets --clobber
          else
            # shellcheck disable=SC2086 # deliberate word splitting into separate file args
            gh release create "$TAG" $assets --title "$VERSION" --notes-file dist/notes.md
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
