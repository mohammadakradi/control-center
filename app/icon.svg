<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#121a26"/>
      <stop offset="55%" stop-color="#0c121c"/>
      <stop offset="100%" stop-color="#070b12"/>
    </radialGradient>

    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#fbfdff"/>
      <stop offset="38%" stop-color="#d4dae2"/>
      <stop offset="62%" stop-color="#aab2bf"/>
      <stop offset="100%" stop-color="#dde2e9"/>
    </linearGradient>

    <linearGradient id="blue" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"  stop-color="#34a7ff"/>
      <stop offset="45%" stop-color="#1683ff"/>
      <stop offset="100%" stop-color="#0a59f0"/>
    </linearGradient>

    <linearGradient id="blueDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#2b9bff"/>
      <stop offset="100%" stop-color="#0b54e6"/>
    </linearGradient>

    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <g filter="url(#lift)">
    <!-- Outer ring: silver left -->
    <path d="M 48.61 282.42 A 252.00 252.00 0 0 1 282.42 48.61 L 285.56 93.50 A 207.00 207.00 0 0 0 93.50 285.56 Z" fill="url(#silver)"/>
    <path d="M 282.42 551.39 A 252.00 252.00 0 0 1 48.61 317.58 L 93.50 314.44 A 207.00 207.00 0 0 0 285.56 506.50 Z" fill="url(#silver)"/>
    <!-- Outer ring: blue right -->
    <path d="M 317.58 48.61 A 252.00 252.00 0 0 1 526.50 189.53 L 486.05 209.26 A 207.00 207.00 0 0 0 314.44 93.50 Z" fill="url(#blue)"/>
    <path d="M 526.50 410.47 A 252.00 252.00 0 0 1 317.58 551.39 L 314.44 506.50 A 207.00 207.00 0 0 0 486.05 390.74 Z" fill="url(#blueDeep)"/>
  </g>

  <g filter="url(#lift)">
    <!-- Inner C -->
    <path d="M 419.78 393.58 A 152.00 152.00 0 1 1 419.78 206.42 L 375.65 240.90 A 96.00 96.00 0 1 0 375.65 359.10 Z" fill="url(#blue)"/>
    <!-- Spoke + dot -->
    <path d="M 300.00 285.00 L 448.00 285.00 L 448.00 315.00 L 300.00 315.00 Z" fill="url(#blueDeep)"/>
    <circle cx="300.00" cy="300.00" r="23" fill="url(#blue)"/>
  </g>
</svg>
